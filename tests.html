<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Tile Shuffle — Tests</title>
  <style>
    body {
      font-family: ui-monospace, "Cascadia Code", Menlo, monospace;
      background: #111;
      color: #ddd;
      padding: 1.25rem;
      line-height: 1.4;
    }
    h1 { font-size: 1.1rem; font-weight: 600; }
    .pass { color: #7dcea0; }
    .fail { color: #f1948a; }
    #summary { margin-top: 1rem; font-weight: 600; }
    a { color: #5b9fd4; }
  </style>
</head>
<body>
  <h1>Photo Tile Shuffle — unit tests</h1>
  <p><a href="index.html">← Back to app</a></p>
  <pre id="out"></pre>
  <p id="summary"></p>

  <script src="shuffle-core.js"></script>
  <script src="core-tests.js"></script>
  <script>
    (function () {
      const C = window.PhotoShuffleCore;
      const out = document.getElementById("out");
      const summary = document.getElementById("summary");
      let passed = 0;
      let failed = 0;
      const lines = [];

      function assert(name, cond, detail) {
        if (cond) {
          passed++;
          lines.push("PASS  " + name);
        } else {
          failed++;
          lines.push("FAIL  " + name + (detail ? " — " + detail : ""));
        }
      }

      window.PhotoShuffleCoreTests.run(C, assert);

      out.innerHTML = lines
        .map(function (l) {
          const cls = l.startsWith("PASS") ? "pass" : "fail";
          return '<span class="' + cls + '">' + l.replace(/</g, "&lt;") + "</span>";
        })
        .join("\n");

      summary.textContent =
        failed === 0
          ? "All " + passed + " tests passed."
          : passed + " passed, " + failed + " failed.";
      summary.className = failed === 0 ? "pass" : "fail";
    })();
  </script>
</body>
</html>
